<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Configuration Details</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 1rem auto; padding: 0 .75rem; max-width: 564px; background: #101720; color: #d5dfeb; font: 15px/1.6 "Courier New", Courier, monospace; }
    .report-box { width: 100%; max-width: 540px; min-width: 0; margin: 0 auto 1rem; padding: .75rem; border: 1px solid #40566e; background: #101720; overflow-wrap: anywhere; }
    h1 { margin: 0; font-size: 1.5em; line-height: 1.4; }
    p { margin: 0 0 .75rem; }
    p:last-child { margin-bottom: 0; }
    a { color: #80bdff; }
    nav.report-box { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    nav a:last-child { text-align: right; }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .4rem; border: 1px solid #40566e; text-align: left; vertical-align: top; }
    th { background: #151f2b; }
    #message:empty { display: none; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; margin: 0; }
  </style>
  <script src="report-csv.js" defer></script>
  <script src="golden-configurations.js" defer></script>
</head>
<body data-page="detail">
  <header class="report-box"><h1 id="title">Golden Configuration Details</h1></header>
  <main class="report-box">
    <p id="message" role="status">Loading details…</p>
    <pre id="detail"></pre>
    <noscript>Enable JavaScript to view these details.</noscript>
  </main>
  <nav class="report-box" aria-label="Report links"><a href="golden-configurations.html">Back</a></nav>
</body>
</html>
