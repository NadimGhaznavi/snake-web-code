<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Golden Configurations</title>
  <style>
    body { margin: 2rem auto; padding: 0 1rem; max-width: 1400px; background: #101720; color: #d5dfeb; font: 16px/1.6 "Courier New", monospace; }
    a { color: #80bdff; }
    .table-scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: .6rem; border: 1px solid #40566e; text-align: left; vertical-align: top; }
    th { background: #151f2b; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; min-width: 240px; max-width: 650px; }
    summary { cursor: pointer; color: #80bdff; }
  </style>
  <script src="golden-configurations.js" defer></script>
</head>
<body>
  <h1>Golden Configurations</h1>
  <a href="../">Home</a>
  <p>Accepted configurations, including initial and seed baselines, newest first.
    Expand Reason to read the LLM reasoning associated with a proposal.</p>
  <p><a href="data/golden-configurations.csv">Download golden history CSV</a></p>
  <p id="message" role="status">Loading golden configurations…</p>
  <div class="table-scroll">
    <table aria-label="Golden configurations" hidden id="golden-table">
      <thead><tr><th scope="col">Date</th><th scope="col">Time</th><th scope="col">Configuration run</th><th scope="col">High Score</th><th scope="col">Parameter</th><th scope="col">Change</th><th scope="col">Reason</th></tr></thead>
      <tbody id="golden-rows"></tbody>
    </table>
  </div>
  <noscript>Enable JavaScript to view the table, or download the CSV history.</noscript>
</body>
</html>
